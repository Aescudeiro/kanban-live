services:
  postgres:
    image: postgres:17-alpine
    container_name: kanban-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kanban}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kanban}
      POSTGRES_DB: ${POSTGRES_DB:-kanban_live}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - kanban-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-kanban} -d ${POSTGRES_DB:-kanban_live}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  kanban-pgdata:
